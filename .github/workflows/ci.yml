name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install httpx
      - name: Download SKAB Benchmark Data
        run: |
          mkdir -p data/raw
          curl -sL https://raw.githubusercontent.com/waico/SKAB/master/data/anomaly-free/anomaly-free.csv -o data/raw/anomaly-free.csv
          curl -sL https://raw.githubusercontent.com/waico/SKAB/master/data/valve1/0.csv -o data/raw/valve1_0.csv
      - name: Train Model & Build Predictor Artifact
        run: python -m src.models.predictor
      - name: Run Automated Pytest Suite
        run: python -m pytest -v